<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title data-keep>Abdullah Portfolio</title>
<link data-keep rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&family=Instrument+Serif&display=swap">
<style data-keep id="app-style">
/* Layout: one calm column. Name, then a drawing-sheet title block (discipline, institution, location, contact), then sections. Entries read as a years | content grid. */
:root{
  --bg:#F5F7F9; --surface:#FFFFFF; --ink:#13202C; --muted:#586775; --line:#D3DAE1; --accent:#1B5CA8; --accent-ink:#FFFFFF; --edit:#A94A14;
  --display:"Instrument Serif",Georgia,"Times New Roman",serif;
  --body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --gl:max(16px,env(safe-area-inset-left,0px)); --gr:max(16px,env(safe-area-inset-right,0px));
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){--bg:#0E151C; --surface:#151E27; --ink:#E5EBF0; --muted:#98A6B3; --line:#263340; --accent:#7DB1EE; --accent-ink:#0E151C; --edit:#F0955C; color-scheme:dark}
}
:root[data-theme="dark"]{--bg:#0E151C; --surface:#151E27; --ink:#E5EBF0; --muted:#98A6B3; --line:#263340; --accent:#7DB1EE; --accent-ink:#0E151C; --edit:#F0955C; color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:400 16px/1.6 var(--body);padding-block:0 72px;padding-inline:var(--gl) var(--gr);-webkit-text-size-adjust:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.wrap{max-width:880px;margin-inline:auto}
h1,h2,h3,p,ul{margin:0}
button{font:inherit}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* top bar */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:var(--bg);border-bottom:1px solid var(--line);margin-inline:calc(var(--gl)*-1) calc(var(--gr)*-1);padding:8px var(--gr) 8px var(--gl);display:flex;gap:12px;align-items:center;justify-content:space-between}
.bar.editing{border-bottom-color:var(--edit)}
.nav{display:flex;gap:2px;overflow-x:auto;min-width:0;scrollbar-width:none}
.nav::-webkit-scrollbar{display:none}
.nav a{white-space:nowrap;font:500 .72rem var(--mono);text-transform:uppercase;letter-spacing:.07em;color:var(--muted);text-decoration:none;padding:7px 9px;border-radius:3px}
.nav a:hover{color:var(--accent)}
.acts{display:flex;gap:8px;align-items:center;flex:none}
.status{font:500 .7rem var(--mono);text-transform:uppercase;letter-spacing:.07em;color:var(--edit)}
.status.err{text-transform:none;letter-spacing:0;max-width:34ch;line-height:1.3}
.notice{margin-top:12px;padding:10px 12px;border:1px solid var(--edit);border-radius:4px;display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;font-size:.9rem}

/* masthead */
.mast{padding-block:44px 14px;display:grid;gap:26px}
.mast-top{display:flex;gap:24px 32px;flex-wrap:wrap;align-items:flex-start}
.mast-text{flex:1 1 380px;min-width:0}
h1{font:400 clamp(2.9rem,9vw,4.8rem)/1 var(--display);letter-spacing:-.012em;overflow-wrap:anywhere}
.tag{font-size:1.14rem;line-height:1.55;max-width:56ch;margin-top:16px}
.links{display:flex;flex-wrap:wrap;gap:6px 18px;margin-top:14px}
.links a{font:500 .85rem var(--mono);text-decoration:none;border-bottom:1px solid var(--line)}
.links a::after{content:" \2197"}
.links a:hover{border-bottom-color:var(--accent)}
.avatar{display:block;width:120px;height:120px;object-fit:cover;border-radius:4px;border:1px solid var(--line);background:var(--surface)}
.avatar.ph{display:grid;place-items:center;font:.72rem var(--mono);color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
.avatar-edit{display:grid;gap:8px;justify-items:start}
.tblock{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,190px),1fr));gap:1px;background:var(--line);border:1px solid var(--line)}
.tcell{background:var(--surface);padding:10px 12px;min-width:0}
.k{display:block;font:500 .64rem var(--mono);text-transform:uppercase;letter-spacing:.11em;color:var(--muted);margin-bottom:3px}
.v{overflow-wrap:anywhere;font-size:.95rem}
.copy{font:500 .62rem var(--mono);text-transform:uppercase;letter-spacing:.06em;border:1px solid var(--line);background:transparent;color:var(--muted);border-radius:3px;padding:1px 6px;margin-left:6px;cursor:pointer}
.copy:hover{color:var(--accent);border-color:var(--accent)}

/* sections */
.sec{padding-block:34px 4px;scroll-margin-top:76px}
.sec-h{display:flex;align-items:center;gap:14px;margin-bottom:20px}
.sec-h h2{font:500 .78rem var(--mono);text-transform:uppercase;letter-spacing:.14em;color:var(--accent);white-space:nowrap}
.rule{flex:1;height:1px;background:var(--line);min-width:12px}
.sec-ctl{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.badge{font:500 .62rem var(--mono);text-transform:uppercase;letter-spacing:.1em;color:var(--muted)}
.prose p{margin-bottom:.8em;max-width:66ch}
.prose p:last-child{margin-bottom:0}
.chips{display:flex;flex-wrap:wrap;gap:6px;list-style:none;padding:0;margin-top:10px}
.chips.big{margin-top:0}
.chips li{font:400 .76rem var(--mono);border:1px solid var(--line);background:var(--surface);padding:3px 9px;border-radius:3px}
.chips.big li{font-size:.84rem;padding:5px 11px}

.entries>.entry:first-child{padding-top:0}
.entry{display:grid;grid-template-columns:150px minmax(0,1fr);gap:6px 28px;padding-block:20px}
.entry+.entry{border-top:1px solid var(--line)}
.entry>*{min-width:0}
.period{font:400 .8rem/1.6 var(--mono);color:var(--muted);padding-top:.28rem}
.e-title{font:600 1.1rem/1.4 var(--body)}
.e-sub{color:var(--muted);margin-bottom:8px}
.entry .links{margin-top:12px}
.media-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,240px),1fr));gap:12px;margin-top:16px}
.media-grid.wide{grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr));margin-top:0}
.media{margin:0;background:var(--surface);border:1px solid var(--line);border-radius:4px;overflow:hidden;min-width:0;display:flex;flex-direction:column}
.media.video{grid-column:1/-1}
.media img{display:block;width:100%;height:auto;cursor:zoom-in}
.media video{display:block;width:100%;max-height:68vh;background:#000}
.media .pdf{display:flex;justify-content:space-between;gap:12px;padding:14px 12px;text-decoration:none;font:500 .85rem var(--mono)}
.cap{font-size:.84rem;color:var(--muted);padding:8px 10px}
.mctl{display:flex;gap:6px;padding:8px 10px;flex-wrap:wrap}
.foot{margin-top:60px;padding-top:16px;border-top:1px solid var(--line);font:400 .72rem var(--mono);color:var(--muted)}

/* edit controls */
.ctl{display:inline-flex;align-items:center;font:500 .7rem var(--mono);text-transform:uppercase;letter-spacing:.06em;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:6px 10px;border-radius:3px;cursor:pointer;line-height:1.2}
.ctl:hover{border-color:var(--accent);color:var(--accent)}
.ctl.danger:hover{border-color:var(--edit);color:var(--edit)}
.ctl.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.ctl.on:hover{color:var(--accent-ink);filter:brightness(1.08)}
.in{display:block;width:100%;font:inherit;color:inherit;background:var(--surface);border:1px dashed var(--line);border-radius:3px;padding:6px 9px;resize:none;overflow:hidden}
.in::placeholder{color:var(--muted);opacity:.8}
.in:focus{outline:2px solid var(--accent);outline-offset:1px;border-style:solid}
.h1-in{font:400 clamp(2rem,6vw,3.2rem)/1.1 var(--display)}
.tag-in{font-size:1.1rem;margin-top:14px;max-width:60ch}
.sec-t{font:500 .78rem var(--mono);text-transform:uppercase;letter-spacing:.14em;color:var(--accent);width:min(100%,30ch)}
.e-title.in{font-weight:600;font-size:1.05rem}
.e-sub.in{color:inherit;margin-top:6px;margin-bottom:6px}
.period.in{font:400 .8rem var(--mono)}
.prose-in{margin-top:6px}
.ectl{grid-column:2;display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.lrow{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,2fr) auto;gap:6px;margin-top:6px}
.ledit{margin-top:10px;display:flex;flex-wrap:wrap;gap:6px;align-items:flex-start}
.ledit .lrow{flex:1 1 100%}
.up{margin-top:12px;align-self:flex-start}
.add-sec{margin-top:40px;padding:16px;border:1px dashed var(--edit);border-radius:4px;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.add-sec .k{margin:0 8px 0 0}
.add-entry{margin-top:12px}

#lightbox{position:fixed;inset:0;z-index:50;background:rgba(6,10,14,.92);display:grid;place-items:center;padding:max(16px,env(safe-area-inset-top,0px)) var(--gr) max(16px,env(safe-area-inset-bottom,0px)) var(--gl);cursor:zoom-out}
#lightbox img{max-width:100%;max-height:100%;object-fit:contain}

@media (max-width:620px){
  .entry{grid-template-columns:1fr}
  .ectl{grid-column:1}
  .mast{padding-top:30px}
  .lrow{grid-template-columns:1fr auto}
  .lrow .l-url{grid-column:1/-1;order:3}
  .bar .status{display:none}
  .bar .status.err{display:block}
}
@media (prefers-reduced-motion:no-preference){
  .ctl,.nav a,.links a{transition:color .15s,border-color .15s}
}

/* standalone page */
:root{color-scheme:light}
body{margin:0}
img{max-width:100%}
</style>

body":"Worked on static and dynamic pile load testing and on quality control for piling work.","tags":["Static load test","Dynamic load test","Quality control"],"links":[],"media":[]}]}]}</script>
<script id="app-script">
(function(){
'use strict';
var root=document.getElementById('root');
var state=JSON.parse(document.getElementById('app-state').textContent);
var saved=JSON.stringify(state);
var editing=false,dirty=false,canEdit=(location.hash==='#edit');
var pending={};
var armed=null,armedT=0,focusPath='';
var reduce=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;
var KIND={'image/png':'image','image/jpeg':'image','image/gif':'image','image/webp':'image','video/mp4':'video','video/webm':'video','application/pdf':'pdf'};
var EXT={'image/png':'png','image/jpeg':'jpg','image/gif':'gif','image/webp':'webp','video/mp4':'mp4','video/webm':'webm','application/pdf':'pdf'};
var ACCEPT='image/png,image/jpeg,image/gif,image/webp,video/mp4,video/webm,application/pdf';
var TYPE_LABEL={text:'Text',entries:'Entries',gallery:'Gallery',chips:'Tags'};

/* ---------- helpers ---------- */
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function uid(){return Math.random().toString(36).slice(2,9);}
function pathOk(p){return /^media\/[\w.\-]+$/.test(p||'');}
function srcOf(p){return pending[p]?pending[p].url:p;}
function safeUrl(u){u=(u||'').trim();if(/^https?:\/\//i.test(u)||pathOk(u))return u;if(/^[\w-]+(\.[\w-]+)+(\/\S*)?$/.test(u))return 'https://'+u;return '';}
function paras(t){return String(t||'').split(/\n+/).filter(function(x){return x.trim();}).map(function(x){return '<p>'+esc(x)+'</p>';}).join('');}
function move(arr,i,d){var j=i+d;if(j<0||j>=arr.length)return;var x=arr[i];arr[i]=arr[j];arr[j]=x;}
function setPath(path,val){var k=path.split('.'),o=state;for(var n=0;n<k.length-1;n++){o=o[k[n]];if(o==null)return;}o[k[k.length-1]]=val;}
function tgt(d){if(d.s==='p')return state.profile;var sec=state.sections[+d.i];return d.s==='e'?sec.items[+d.j]:sec;}
function base(s,i,j){return s==='p'?'profile.':s==='e'?'sections.'+i+'.items.'+j+'.':'sections.'+i+'.';}
function da(s,i,j){return ' data-s="'+s+'" data-i="'+(i==null?'':i)+'" data-j="'+(j==null?'':j)+'"';}
function isBlank(it){return !(it.title||it.subtitle||it.period||it.body||(it.tags&&it.tags.length)||(it.links&&it.links.length)||(it.media&&it.media.length));}
function secEmpty(s){
  if(s.type==='text')return !(s.body||'').trim();
  if(s.type==='chips')return !(s.chips&&s.chips.length);
  if(s.type==='gallery')return !(s.media&&s.media.length);
  return !(s.items||[]).some(function(it){return !isBlank(it);});
}
function usedFiles(){
  var u={};
  function add(p){if(pathOk(p))u[p]=1;}
  add(state.profile.avatar);
  (state.profile.links||[]).forEach(function(l){add(l.url);});
  state.sections.forEach(function(s){
    (s.media||[]).forEach(function(m){add(m.file);});
    (s.items||[]).forEach(function(it){(it.media||[]).forEach(function(m){add(m.file);});(it.links||[]).forEach(function(l){add(l.url);});});
  });
  return u;
}
function inp(path,val,ph,cls,kind){
  if(Array.isArray(val))val=val.join(', ');
  return '<input class="in '+(cls||'')+'" data-bind="'+path+'"'+(kind?' data-kind="'+kind+'"':'')+' value="'+esc(val)+'" placeholder="'+esc(ph)+'" aria-label="'+esc(ph)+'">';
}
function area(path,val,ph,cls,kind){
  if(Array.isArray(val))val=val.join(', ');
  return '<textarea class="in '+(cls||'')+'" rows="1" data-bind="'+path+'"'+(kind?' data-kind="'+kind+'"':'')+' placeholder="'+esc(ph)+'" aria-label="'+esc(ph)+'">'+esc(val)+'</textarea>';
}
function grow(t){t.style.height='auto';t.style.height=(t.scrollHeight+2)+'px';}
function setStatus(t,err){var s=document.getElementById('status');if(s){s.textContent=t;s.className='status'+(err?' err':'');}}
function markDirty(){dirty=true;setStatus('Unsaved changes');}
function confirmDel(key,btn,msg){
  if(armed===key){armed=null;return true;}
  armed=key;var old=btn.textContent;btn.textContent=msg;clearTimeout(armedT);
  armedT=setTimeout(function(){if(armed===key){armed=null;btn.textContent=old;}},3000);
  return false;
}

/* ---------- building blocks ---------- */
function linksHTML(s,i,j){
  var t=tgt({s:s,i:i,j:j}),arr=t.links||[],b=base(s,i,j)+'links.';
  if(!editing){
    var out=arr.map(function(l){var u=safeUrl(l.url);return u?'<a href="'+esc(srcOf(u))+'" target="_blank" rel="noopener">'+esc(l.label||u.replace(/^https?:\/\//,''))+'</a>':'';}).join('');
    return out?'<div class="links">'+out+'</div>':'';
  }
  var rows=arr.map(function(l,k){
    return '<div class="lrow">'+inp(b+k+'.label',l.label,'Label','l-label')+inp(b+k+'.url',l.url,'Link, e.g. https://github.com/you','l-url')+'<button class="ctl danger" data-act="link-del"'+da(s,i,j)+' data-k="'+k+'" aria-label="Remove link">Remove</button></div>';
  }).join('');
  var cv=(s==='p')?'<label class="ctl">+ Upload CV (PDF)<input type="file" hidden accept="application/pdf" data-cv></label>':'';
  return '<div class="ledit">'+rows+'<button class="ctl" data-act="link-add"'+da(s,i,j)+'>+ Link</button>'+cv+'</div>';
}
function mediaHTML(m,s,i,j,k){
  if(!pathOk(m.file))return '';
  var src=esc(srcOf(m.file)),body,cap='',ctl='';
  if(m.kind==='video')body='<video controls preload="metadata" playsinline src="'+src+'"></video>';
  else if(m.kind==='pdf')body='<a class="pdf" href="'+src+'" target="_blank" rel="noopener"><span>'+esc(m.caption||'PDF document')+'</span><span>Open</span></a>';
  else body='<img loading="lazy" src="'+src+'" alt="'+esc(m.caption||'')+'" data-zoom>';
  if(editing){
    cap=inp(base(s,i,j)+'media.'+k+'.caption',m.caption,m.kind==='pdf'?'Document name':'Caption','cap-in');
    ctl='<div class="mctl"><button class="ctl" data-act="m-left"'+da(s,i,j)+' data-k="'+k+'" aria-label="Move earlier">&larr;</button><button class="ctl" data-act="m-right"'+da(s,i,j)+' data-k="'+k+'" aria-label="Move later">&rarr;</button><button class="ctl danger" data-act="m-del"'+da(s,i,j)+' data-k="'+k+'">Remove</button></div>';
  }else if(m.caption&&m.kind!=='pdf')cap='<figcaption class="cap">'+esc(m.caption)+'</figcaption>';
  return '<figure class="media '+esc(m.kind)+'">'+body+cap+ctl+'</figure>';
}
function mediaGrid(s,i,j,arr,wide){
  var cells=(arr||[]).map(function(m,k){return mediaHTML(m,s,i,j,k);}).join('');
  var up=editing?'<label class="ctl up">+ Photo, video or PDF<input type="file" hidden multiple accept="'+ACCEPT+'" data-up'+da(s,i,j)+'></label>':'';
  return (cells?'<div class="media-grid'+(wide?' wide':'')+'">'+cells+'</div>':'')+up;
}
function entryHTML(i,it,j){
  var E=editing;
  if(!E&&isBlank(it))return '';
  var b=base('e',i,j);
  var left=E?inp(b+'period',it.period,'Years','period'):'<div class="period">'+esc(it.period||'')+'</div>';
  var right=
    (E?inp(b+'title',it.title,'Title: degree, project or role','e-title'):(it.title?'<h3 class="e-title">'+esc(it.title)+'</h3>':''))+
    (E?inp(b+'subtitle',it.subtitle,'Institution, lab or context','e-sub'):(it.subtitle?'<p class="e-sub">'+esc(it.subtitle)+'</p>':''))+
    (E?area(b+'body',it.body,'What you did and what you found. A blank line starts a new paragraph.','prose-in'):(it.body?'<div class="prose">'+paras(it.body)+'</div>':''))+
    (E?'<div style="margin-top:8px">'+inp(b+'tags',it.tags||[],'Tags, separated by commas','tags-in','list')+'</div>':((it.tags&&it.tags.length)?'<ul class="chips">'+it.tags.map(function(t){return '<li>'+esc(t)+'</li>';}).join('')+'</ul>':''))+
    linksHTML('e',i,j)+
    mediaGrid('e',i,j,it.media||[],false);
  var ctl=E?'<div class="ectl"><button class="ctl" data-act="item-up" data-i="'+i+'" data-j="'+j+'" aria-label="Move entry up">&uarr;</button><button class="ctl" data-act="item-down" data-i="'+i+'" data-j="'+j+'" aria-label="Move entry down">&darr;</button><button class="ctl danger" data-act="item-del" data-i="'+i+'" data-j="'+j+'">Delete entry</button></div>':'';
  return '<article class="entry"><div>'+left+'</div><div>'+right+'</div>'+ctl+'</article>';
}
function sectionHTML(sec,i){
  var E=editing;
  if(!E&&secEmpty(sec))return '';
  var head='<div class="sec-h">'+(E?inp('sections.'+i+'.title',sec.title,'Section title','sec-t'):'<h2>'+esc(sec.title)+'</h2>')+'<span class="rule"></span>'+
    (E?'<span class="sec-ctl"><span class="badge">'+esc(TYPE_LABEL[sec.type]||sec.type)+'</span><button class="ctl" data-act="sec-up" data-i="'+i+'" aria-label="Move section up">&uarr;</button><button class="ctl" data-act="sec-down" data-i="'+i+'" aria-label="Move section down">&darr;</button><button class="ctl danger" data-act="sec-del" data-i="'+i+'">Delete</button></span>':'')+'</div>';
  var body='';
  if(sec.type==='text')body=E?area('sections.'+i+'.body',sec.body,'Write a short paragraph. A blank line starts a new paragraph.','prose-in'):'<div class="prose">'+paras(sec.body)+'</div>';
  else if(sec.type==='chips')body=E?area('sections.'+i+'.chips',sec.chips||[],'Items separated by commas, e.g. Abaqus, Python, MATLAB','prose-in','list'):'<ul class="chips big">'+(sec.chips||[]).map(function(c){return '<li>'+esc(c)+'</li>';}).join('')+'</ul>';
  else if(sec.type==='gallery')body=mediaGrid('g',i,null,sec.media||[],true);
  else{
    var items=sec.items||[];
    body='<div class="entries">'+items.map(function(it,j){return entryHTML(i,it,j);}).join('')+'</div>'+(E?'<button class="ctl add-entry" data-act="item-add" data-i="'+i+'">+ Add entry</button>':'');
  }
  return '<section class="sec" id="s-'+esc(sec.id)+'">'+head+body+'</section>';
}
function headerHTML(){
  var p=state.profile,E=editing;
  var cells=[['Discipline','discipline','Your field'],['Institution','affiliation','University or lab'],['Location','location','City, country'],['Seeking','seeking','e.g. PhD position in structural engineering'],['Contact','email','name@university.edu']];
  var tb=cells.map(function(c){
    var v=p[c[1]];
    if(!E&&!v)return '';
    var val=E?inp('profile.'+c[1],v,c[2]):(c[1]==='email'?'<span class="v">'+esc(v)+'</span><button class="copy" data-act="copy" data-v="'+esc(v)+'">Copy</button>':'<span class="v">'+esc(v)+'</span>');
    return '<div class="tcell"><span class="k">'+c[0]+'</span>'+val+'</div>';
  }).join('');
  var av='';
  if(E){
    av='<div class="avatar-edit">'+(pathOk(p.avatar)?'<img class="avatar" src="'+esc(srcOf(p.avatar))+'" alt="">':'<div class="avatar ph">Photo</div>')+
      '<label class="ctl">'+(p.avatar?'Replace photo':'Add photo')+'<input type="file" hidden accept="image/png,image/jpeg,image/webp" data-avatar></label>'+
      (p.avatar?'<button class="ctl danger" data-act="avatar-del">Remove</button>':'')+'</div>';
  }else if(pathOk(p.avatar))av='<img class="avatar" src="'+esc(srcOf(p.avatar))+'" alt="Portrait of '+esc(p.name)+'">';
  var h1=E?inp('profile.name',p.name,'Your name','h1-in'):'<h1>'+esc(p.name)+'</h1>';
  var tag=E?area('profile.tagline',p.tagline,'One or two sentences on who you are and what you study','tag-in'):(p.tagline?'<p class="tag">'+esc(p.tagline)+'</p>':'');
  return '<header class="mast"><div class="mast-top"><div class="mast-text">'+h1+tag+linksHTML('p',null,null)+'</div>'+av+'</div>'+(tb?'<div class="tblock">'+tb+'</div>':'')+'</header>';
}
function barHTML(){
  var nav=state.sections.map(function(s){
    if(!editing&&secEmpty(s))return '';
    return '<a href="#s-'+esc(s.id)+'" data-nav="'+esc(s.id)+'">'+esc(s.title||'Untitled')+'</a>';
  }).join('');
  var acts='';
  if(canEdit){
    acts=!editing?'<button class="ctl" data-act="edit">Edit page</button>':
      '<span class="status" id="status" role="status">'+(dirty?'Unsaved changes':'Editing')+'</span><button class="ctl" data-act="discard">Discard</button><button class="ctl on" data-act="save">Download updated site</button>';
  }
  return '<div class="bar'+(editing?' editing':'')+'"><nav class="nav" aria-label="Sections">'+nav+'</nav><div class="acts">'+acts+'</div></div>';
}
function addSecHTML(){
  return '<div class="add-sec"><span class="k">Add section</span>'+
    '<button class="ctl" data-act="sec-add" data-type="text">Text</button>'+
    '<button class="ctl" data-act="sec-add" data-type="entries">Entries (education, projects, work)</button>'+
    '<button class="ctl" data-act="sec-add" data-type="gallery">Gallery</button>'+
    '<button class="ctl" data-act="sec-add" data-type="chips">Tags</button></div>';
}
function footHTML(){
  var d=new Date(state.updated),t=isNaN(d)?'':d.toLocaleDateString('en',{month:'long',year:'numeric'});
  return '<footer class="foot">'+(t?'Last updated '+esc(t):'')+'</footer>';
}
function render(){
  var y=window.scrollY||0;
  root.className=editing?'is-editing':'';
  var secs=state.sections.map(sectionHTML).join('');
  root.innerHTML=barHTML()+'<div class="wrap">'+headerHTML()+'<main>'+secs+(editing?addSecHTML():'')+'</main>'+footHTML()+'</div>';
  [].forEach.call(root.querySelectorAll('textarea'),grow);
  if(focusPath){var el=root.querySelector('[data-bind="'+focusPath+'"]');if(el)el.focus();focusPath='';}
  else window.scrollTo(0,y);
}

/* ---------- actions ---------- */
function newSection(type,id){
  var s={id:id,type:type,title:{text:'New section',entries:'New list',gallery:'Gallery',chips:'Tags'}[type]||'New section'};
  if(type==='text')s.body='';
  if(type==='chips')s.chips=[];
  if(type==='gallery')s.media=[];
  if(type==='entries')s.items=[newItem()];
  return s;
}
function newItem(){return {title:'',subtitle:'',period:'',body:'',tags:[],links:[],media:[]};}
function act(a,d,btn){
  switch(a){
    case 'edit':editing=true;render();return;
    case 'save':save();return;
    case 'discard':
      if(dirty&&!confirmDel('discard',btn,'Click again to discard'))return;
      state=JSON.parse(saved);dirty=false;editing=false;render();return;
    case 'copy':{
      var v=btn.dataset.v;
      var sel=function(){var r=document.createRange();r.selectNodeContents(btn.previousElementSibling);var s=window.getSelection();s.removeAllRanges();s.addRange(r);};
      var ok=function(){btn.textContent='Copied';setTimeout(function(){btn.textContent='Copy';},1500);};
      try{navigator.clipboard.writeText(v).then(ok,sel);}catch(e){sel();}
      return;
    }
    case 'sec-up':move(state.sections,+d.i,-1);break;
    case 'sec-down':move(state.sections,+d.i,1);break;
    case 'sec-del':if(!confirmDel('s'+d.i,btn,'Sure? Click again'))return;state.sections.splice(+d.i,1);break;
    case 'sec-add':state.sections.push(newSection(d.type,'s'+uid()));focusPath='sections.'+(state.sections.length-1)+'.title';break;
    case 'item-add':{var sec=state.sections[+d.i];sec.items.push(newItem());focusPath='sections.'+d.i+'.items.'+(sec.items.length-1)+'.title';break;}
    case 'item-up':move(state.sections[+d.i].items,+d.j,-1);break;
    case 'item-down':move(state.sections[+d.i].items,+d.j,1);break;
    case 'item-del':if(!confirmDel('i'+d.i+'-'+d.j,btn,'Sure? Click again'))return;state.sections[+d.i].items.splice(+d.j,1);break;
    case 'link-add':{var t=tgt(d);(t.links=t.links||[]).push({label:'',url:''});break;}
    case 'link-del':tgt(d).links.splice(+d.k,1);break;
    case 'm-left':move(tgt(d).media,+d.k,-1);break;
    case 'm-right':move(tgt(d).media,+d.k,1);break;
    case 'm-del':if(!confirmDel('m'+d.i+d.j+d.k,btn,'Sure?'))return;tgt(d).media.splice(+d.k,1);break;
    case 'avatar-del':state.profile.avatar='';break;
    default:return;
  }
  markDirty();render();
}

/* ---------- media ---------- */
function uniquePath(name,type){
  var b=name.replace(/\.[^.]*$/,'').toLowerCase().replace(/[^\w-]+/g,'-').replace(/^-+|-+$/g,'')||'file';
  var ext=EXT[type],p='media/'+b+'.'+ext,n=2,used=usedFiles();
  while(pending[p]||used[p]){p='media/'+b+'-'+n+'.'+ext;n++;}
  return p;
}
async function prep(f){
  var kind=KIND[f.type];
  if(!kind)return null;
  var blob=f,type=f.type;
  if(kind==='image'&&f.type!=='image/gif'){
    try{
      var bmp=await createImageBitmap(f),max=1800;
      if(bmp.width>max){
        var c=document.createElement('canvas');
        c.width=max;c.height=Math.round(bmp.height*max/bmp.width);
        c.getContext('2d').drawImage(bmp,0,0,c.width,c.height);
        var want=f.type==='image/png'?'image/png':f.type==='image/webp'?'image/webp':'image/jpeg';
        var out=await new Promise(function(r){c.toBlob(r,want,0.86);});
        if(out&&out.size<f.size){blob=out;type=out.type||want;}
      }
    }catch(e){}
  }
  return {blob:blob,type:type,kind:kind};
}
async function onFiles(input){
  var files=[].slice.call(input.files||[]);
  var d={s:input.dataset.s,i:input.dataset.i,j:input.dataset.j};
  var isAvatar=input.hasAttribute('data-avatar'),isCv=input.hasAttribute('data-cv');
  input.value='';
  for(var n=0;n<files.length;n++){
    var f=files[n];
    setStatus('Adding '+f.name+'...');
    var r=await prep(f);
    if(!r||(isAvatar&&r.kind!=='image')||(isCv&&r.kind!=='pdf')){setStatus(f.name+': use JPG, PNG, WebP, GIF, MP4, WebM or PDF.',true);continue;}
    var p=uniquePath(f.name,r.type);
    pending[p]={blob:r.blob,type:r.type,url:URL.createObjectURL(r.blob)};
    if(isAvatar)state.profile.avatar=p;
    else if(isCv){state.profile.links=state.profile.links||[];state.profile.links.push({label:'CV',url:p});}
    else{var t=tgt(d);(t.media=t.media||[]).push({file:p,kind:r.kind,caption:''});}
    dirty=true;render();setStatus('Added. Download the updated site when you are done.');
  }
}

/*ZIP*/
var CRC=null;
function crc32(u8){
  if(!CRC){CRC=new Uint32Array(256);for(var n=0;n<256;n++){var c=n;for(var k=0;k<8;k++)c=(c&1)?(0xEDB88320^(c>>>1)):(c>>>1);CRC[n]=c>>>0;}}
  var x=0xFFFFFFFF;
  for(var i=0;i<u8.length;i++)x=CRC[(x^u8[i])&255]^(x>>>8);
  return (x^0xFFFFFFFF)>>>0;
}
function le(n,b){var a=[];for(var i=0;i<b;i++)a.push((n>>>(8*i))&255);return new Uint8Array(a);}
function makeZip(files){
  var enc=new TextEncoder(),parts=[],cen=[],off=0,d=new Date();
  var time=(d.getHours()<<11)|(d.getMinutes()<<5)|(d.getSeconds()>>1);
  var date=((d.getFullYear()-1980)<<9)|((d.getMonth()+1)<<5)|d.getDate();
  files.forEach(function(f){
    var name=enc.encode(f.name),crc=crc32(f.data),size=f.data.length;
    var lh=[le(0x04034b50,4),le(20,2),le(0x0800,2),le(0,2),le(time,2),le(date,2),le(crc,4),le(size,4),le(size,4),le(name.length,2),le(0,2),name];
    var ch=[le(0x02014b50,4),le(20,2),le(20,2),le(0x0800,2),le(0,2),le(time,2),le(date,2),le(crc,4),le(size,4),le(size,4),le(name.length,2),le(0,2),le(0,2),le(0,2),le(0,2),le(0,4),le(off,4),name];
    lh.forEach(function(x){parts.push(x);off+=x.length;});
    parts.push(f.data);off+=size;
    cen.push(ch);
  });
  var cdStart=off,cdSize=0;
  cen.forEach(function(ch){ch.forEach(function(x){parts.push(x);cdSize+=x.length;});});
  [le(0x06054b50,4),le(0,2),le(0,2),le(files.length,2),le(files.length,2),le(cdSize,4),le(cdStart,4),le(0,2)].forEach(function(x){parts.push(x);});
  return new Blob(parts,{type:'application/zip'});
}
/*ENDZIP*/

/* ---------- saving ---------- */
function build(){
  var keep=[].map.call(document.querySelectorAll('[data-keep]'),function(n){return n.outerHTML;}).join('\n');
  var json=JSON.stringify(state).replace(/</g,'\\u003c');
  var code=document.getElementById('app-script').textContent;
  var S='<'+'script',E='<'+'/script>';
  return '<!doctype html>\n<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">\n'+keep+'\n</head><body>\n<div id="root"></div>\n'+S+' type="application/json" id="app-state">'+json+E+'\n'+S+' id="app-script">'+code+E+'\n</body></html>\n';
}
function download(blob,name){
  var a=document.createElement('a');
  a.href=URL.createObjectURL(blob);a.download=name;
  document.body.appendChild(a);a.click();a.remove();
  setTimeout(function(){URL.revokeObjectURL(a.href);},5000);
}
async function save(){
  var prev=state.updated;
  state.updated=new Date().toISOString();
  setStatus('Preparing files...');
  try{
    var used=usedFiles(),html=build(),files=[{name:'index.html',data:new TextEncoder().encode(html)}];
    for(var p in pending){if(used[p])files.push({name:p,data:new Uint8Array(await pending[p].blob.arrayBuffer())});}
    if(files.length===1)download(new Blob([html],{type:'text/html'}),'index.html');
    else download(makeZip(files),'portfolio-update.zip');
    saved=JSON.stringify(state);dirty=false;
    setStatus(files.length===1?'Downloaded index.html. Replace it in your site folder.':'Downloaded. Unzip and copy the files into your site folder.');
  }catch(e){state.updated=prev;setStatus('Could not create the download.',true);}
}

/* ---------- events ---------- */
root.addEventListener('input',function(e){
  var t=e.target;
  if(!t.dataset||!t.dataset.bind)return;
  var v=t.value;
  if(t.dataset.kind==='list')v=v.split(',').map(function(x){return x.trim();}).filter(Boolean);
  setPath(t.dataset.bind,v);markDirty();
  if(t.tagName==='TEXTAREA')grow(t);
});
root.addEventListener('change',function(e){
  var t=e.target;
  if(t.matches&&t.matches('input[data-up],input[data-avatar],input[data-cv]'))onFiles(t);
});
root.addEventListener('click',function(e){
  var t=e.target,b=t.closest&&t.closest('[data-act]');
  if(b){e.preventDefault();act(b.dataset.act,b.dataset,b);return;}
  var n=t.closest&&t.closest('[data-nav]');
  if(n){e.preventDefault();var el=document.getElementById('s-'+n.dataset.nav);if(el)el.scrollIntoView({behavior:reduce?'auto':'smooth',block:'start'});return;}
  var z=t.closest&&t.closest('img[data-zoom]');
  if(z)openBox(z.currentSrc||z.src,z.alt);
});
var box=document.createElement('div');
box.id='lightbox';box.hidden=true;box.setAttribute('role','dialog');box.setAttribute('aria-label','Image viewer');box.tabIndex=-1;
document.body.appendChild(box);
function openBox(src,alt){box.innerHTML='<img src="'+esc(src)+'" alt="'+esc(alt)+'">';box.hidden=false;box.focus();}
function closeBox(){box.hidden=true;box.innerHTML='';}
box.addEventListener('click',closeBox);
document.addEventListener('keydown',function(e){if(e.key==='Escape'&&!box.hidden)closeBox();});
window.addEventListener('hashchange',function(){
  var c=(location.hash==='#edit');
  if(c!==canEdit){canEdit=c;if(!c)editing=false;render();}
});
window.addEventListener('beforeunload',function(e){if(dirty){e.preventDefault();e.returnValue='';}});

render();
})();

</script>
